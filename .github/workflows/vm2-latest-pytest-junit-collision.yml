name: VM2 Latest Pytest JUnit collision chain
on:
  pull_request:
permissions:
  contents: read
jobs:
  required:
    name: VM2 Latest Pytest JUnit collision required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exact latest Mergify CLI
        uses: Mergifyio/setup-cli@dc99f07e699b94b39e5495c24596372813eadcbc
        with:
          mergify_cli_version: 2026.9.16.1

      - name: Install pytest producer
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Start controlled local quarantine API
        shell: bash
        run: |
          cat > /tmp/vm2-junit-quarantine-stub.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass
              def send_json(self, status, obj):
                  body = json.dumps(obj).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  n = int(self.headers.get("content-length", "0") or 0)
                  body = self.rfile.read(n) if n else b""
                  if self.path.endswith("/quarantines/check"):
                      req = json.loads(body or b"{}")
                      names = req.get("tests_names", [])
                      q = [x for x in names if x == "pkg.A.B.test"]
                      nq = [x for x in names if x not in q]
                      return self.send_json(200, {
                          "quarantined_tests_names": q,
                          "non_quarantined_tests_names": nq,
                      })
                  return self.send_json(200, {})
          ThreadingHTTPServer(("127.0.0.1", 18091), H).serve_forever()
          PY
          nohup python3 /tmp/vm2-junit-quarantine-stub.py >/tmp/vm2-junit-quarantine-stub.out 2>&1 &
          sleep 0.5

      - name: Raw pytest failure then Mergify verdict
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pytest.xml
          test_exit=$?
          set -e
          echo "RAW_PYTEST_EXIT=$test_exit"
          grep -o '<testcase[^>]*>' pytest.xml || true
          mergify --version
          mergify ci junit-process             --api-url http://127.0.0.1:18091             --token vm2-local-dummy             --repository acme/repo             --tests-target-branch main             --test-exit-code "$test_exit"             --color never             pytest.xml
