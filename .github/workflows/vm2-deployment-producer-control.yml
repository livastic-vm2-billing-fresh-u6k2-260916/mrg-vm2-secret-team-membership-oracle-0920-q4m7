name: VM2 deployment producer control
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy
        required: true
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment as github-actions app
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          sha=os.environ["SHA"]
          headers={
            "Authorization":"Bearer "+token,
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "Content-Type":"application/json",
          }
          body=json.dumps({
            "ref":sha,
            "environment":"vm2-deploy",
            "auto_merge":False,
            "required_contexts":[],
            "transient_environment":False,
            "production_environment":False
          }).encode()
          req=urllib.request.Request("https://api.github.com/repos/"+repo+"/deployments",data=body,method="POST",headers=headers)
          with urllib.request.urlopen(req) as r:
            dep=json.load(r)
          print("DEPLOYMENT_ID="+str(dep["id"]))
          status=json.dumps({"state":"success","environment":"vm2-deploy"}).encode()
          req=urllib.request.Request(
            "https://api.github.com/repos/"+repo+"/deployments/"+str(dep["id"])+"/statuses",
            data=status,method="POST",headers=headers)
          with urllib.request.urlopen(req) as r:
            st=json.load(r)
          print("STATUS_ID="+str(st["id"]))
          PY
