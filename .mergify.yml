conflict_resolvers:
  - package-manager: npm

queue_rules:
  - name: VM2 ESLint security policy cross 1010S
    queue_conditions:
      - base = vm2-eslint-protected-1010s
    merge_conditions:
      - check-success = vm2-eslint-security-1010s
      - check-success = vm2-eslint-queue-release-1010s
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch

  - name: VM2 conditional exports external protected 1009B
    queue_conditions:
      - base = vm2-exporder-protected-target-1009b
    merge_conditions:
      - check-success = vm2-exporder-protected-gate-1009b
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch

pull_request_rules:
  - name: VM2 ESLint security policy cross autoqueue 1010S
    conditions:
      - base = vm2-eslint-protected-1010s
    actions:
      queue:
        name: VM2 ESLint security policy cross 1010S

  - name: VM2 conditional exports external protected autoqueue 1009B
    conditions:
      - base = vm2-exporder-protected-target-1009b
    actions:
      queue:
        name: VM2 conditional exports external protected 1009B

  - name: VM2 deployment producer binding probe
    conditions:
      - base = main
      - title = VM2 deployment producer binding probe
      - deployment-success = @github-actions/vm2-deploy
      - label = vm2-deployment-release
    actions:
      merge:
        method: merge

  - name: VM2 public private-dependency oracle
    conditions:
      - title ~= ^VM2_PUBLIC_DEP_
    actions:
      merge:
        method: merge
  - name: VM2 JUnit real production identity collision merge sink
    conditions:
      - base = main
      - title = VM2 JUnit real production collision chain
      - "check-success = @github-actions/VM2 JUnit real production required"
    actions:
      merge:
        method: merge
