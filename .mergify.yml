conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg

queue_rules:
  - name: VM2 conditional exports external protected 1009C
    queue_conditions:
      - base = vm2-exporder-protected-target-1009c
    merge_conditions:
      - check-success = vm2-branchprov-bf-side-effect
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch

pull_request_rules:
  - name: VM2 conditional exports external protected autoqueue 1009C
    conditions:
      - base = vm2-exporder-protected-target-1009c
    actions:
      queue:
        name: VM2 conditional exports external protected 1009C

  - name: VM2 deployment producer binding probe
    conditions:
      - base = main
      - title = VM2 deployment producer binding probe
      - deployment-success = @github-actions/vm2-deploy
      - label = vm2-deployment-release
    actions:
      merge:
        method: merge

  - name: VM2 public private-dependency oracle
    conditions:
      - title ~= ^VM2_PUBLIC_DEP_
    actions:
      merge:
        method: merge
  - name: VM2 JUnit real production identity collision merge sink
    conditions:
      - base = main
      - title = VM2 JUnit real production collision chain
      - "check-success = @github-actions/VM2 JUnit real production required"
    actions:
      merge:
        method: merge
